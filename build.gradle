plugins {
    id 'dev.architectury.loom' apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.register('forge-build') {
    group = 'Forge'
    description = 'Build the Forge JAR'
    dependsOn ':forge:build'
}

tasks.register('forge-runClient') {
    group = 'Forge'
    description = 'Run the Forge client'
    dependsOn ':forge:runClient'
}

tasks.register('fabric-build') {
    group = 'Fabric'
    description = 'Build the Fabric JAR'
    dependsOn ':fabric:build'
}

tasks.register('fabric-runClient') {
    group = 'Fabric'
    description = 'Run the Fabric client'
    dependsOn ':fabric:runClient'
}

subprojects {
    version = mod_version
    group = mod_group_id

    plugins.withId('java') {
        java.toolchain.languageVersion = JavaLanguageVersion.of(17)
        tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    }

    repositories {
        maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
    }
}
