plugins {
    id 'dev.architectury.loom'
}

base {
    archivesName = archives_base_name + '-forge'
}

loom {
    forge {
        mixinConfigs = ["${mod_id}.mixins.json", "${mod_id}.mixins.forge.json"]
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'ymbettercreativemenu-refmap.json'
    }
    runs {
        client {
            client()
        }
        configureEach {
            property 'forge.logging.markers', ''
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    forge "net.minecraftforge:forge:${forge_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

// The common sources are compiled here: FML only loads classes from the mod's own module (the classpath entries
// next to mods.toml), so a separate common JAR would be invisible to it.
sourceSets.main.java.srcDir project(':common').sourceSets.main.java.srcDirs
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    from project(':common').sourceSets.main.resources
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
}
