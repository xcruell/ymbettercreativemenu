modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="YesMenn!, xcruell"
logoFile="icon.png"
# Client-only mod: servers and other clients do not need it.
displayTest="IGNORE_ALL_VERSION"
description='''
Better Creative Menu for Minecraft? Yes Menn!
Did you ever had too many mods installed and Creative Mode Tab navigation was a pain?
Search no more! Better Creative Menu by YesMenn! is the answer.
Features:
- Sorted list with all mod tabs
- Search box for mod names
- Favorite/bookmark function
- Bundles mods with multiple tabs into one collapsable entry
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"